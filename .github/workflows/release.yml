name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - run: scripts/check-static.sh target/${{ matrix.target }}/release/rusty-sock
      - name: Build .deb and .rpm
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rusty-sock dist/rusty-sock-${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Smoke-test scratch image
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker build -t rusty-sock:ci .
          docker run --rm rusty-sock:ci --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
