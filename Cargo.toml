[package]
name = "rusty-sock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, secure SOCKS5 proxy server (RFC 1928 / RFC 1929)"
license = "AGPL-3.0-only"
readme = "README.md"
publish = false

[lib]
name = "rusty_sock"
path = "src/lib.rs"

[[bin]]
name = "rusty-sock"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand", "std"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
ipnet = "2"
password-hash = { version = "0.5", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
cognitive_complexity = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
