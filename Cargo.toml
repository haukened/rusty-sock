[package]
name = "rusty-sock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, secure SOCKS5 proxy server (RFC 1928 / RFC 1929)"
license = "AGPL-3.0-only"
readme = "README.md"
authors = ["David Haukeness <david@hauken.us>"]
publish = false

[lib]
name = "rusty_sock"
path = "src/lib.rs"

[[bin]]
name = "rusty-sock"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand", "std"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
ipnet = "2"
password-hash = { version = "0.5", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
cognitive_complexity = "warn"

# --- Packaging -------------------------------------------------------------
# Both formats package the static musl binary; build it first, e.g.
#   cargo zigbuild --release --target x86_64-unknown-linux-musl
#   cargo deb --no-build --no-strip --target x86_64-unknown-linux-musl
#   cargo generate-rpm --target x86_64-unknown-linux-musl

[package.metadata.deb]
section = "net"
priority = "optional"
extended-description = """\
A small SOCKS5 proxy (RFC 1928) with username/password authentication \
(RFC 1929), UDP ASSOCIATE, an optional TLS listener and an egress policy \
that blocks non-public destinations by default. Runs as a hardened systemd \
service with a dynamic user and no capabilities."""
recommends = "systemd (>= 247)"
assets = [
    ["target/release/rusty-sock", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/rusty-sock/config.toml", "644"],
    ["packaging/users", "etc/rusty-sock/users", "600"],
    ["README.md", "usr/share/doc/rusty-sock/README.md", "644"],
    ["config.example.toml", "usr/share/doc/rusty-sock/config.example.toml", "644"],
    ["packaging/dropins/*.conf", "usr/share/doc/rusty-sock/dropins/", "644"],
]
maintainer-scripts = "packaging/debian"
# Installs packaging/rusty-sock.service; enable/start are left to the admin.
systemd-units = { unit-scripts = "packaging", enable = false, start = false }

[package.metadata.generate-rpm]
summary = "Small, secure SOCKS5 proxy"
auto-req = "no"
post_install_script = "packaging/rpm/post_install.sh"
pre_uninstall_script = "packaging/rpm/pre_uninstall.sh"
post_uninstall_script = "packaging/rpm/post_uninstall.sh"
assets = [
    { source = "target/release/rusty-sock", dest = "/usr/bin/rusty-sock", mode = "755" },
    { source = "packaging/config.toml", dest = "/etc/rusty-sock/config.toml", mode = "644", config = "noreplace" },
    { source = "packaging/users", dest = "/etc/rusty-sock/users", mode = "600", config = "noreplace" },
    { source = "packaging/rusty-sock.service", dest = "/usr/lib/systemd/system/rusty-sock.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/rusty-sock/README.md", mode = "644", doc = true },
    { source = "config.example.toml", dest = "/usr/share/doc/rusty-sock/config.example.toml", mode = "644", doc = true },
    { source = "packaging/dropins/tls.conf", dest = "/usr/share/doc/rusty-sock/dropins/tls.conf", mode = "644", doc = true },
    { source = "packaging/dropins/low-port.conf", dest = "/usr/share/doc/rusty-sock/dropins/low-port.conf", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
systemd = ">= 247"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
