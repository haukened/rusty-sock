# Allow listening on a port below 1024 (e.g. 443). This grants the one
# capability rusty-sock can ever need and nothing else.
# Install as /etc/systemd/system/rusty-sock.service.d/low-port.conf, then:
#   systemctl daemon-reload && systemctl restart rusty-sock
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# User namespaces would hide the capability from the host network stack.
PrivateUsers=no
