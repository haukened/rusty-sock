# Enable the TLS listener's key material for the service.
# Install as /etc/systemd/system/rusty-sock.service.d/tls.conf, add an empty
# [tls] section to /etc/rusty-sock/config.toml, then:
#   systemctl daemon-reload && systemctl restart rusty-sock
# Keep both files root-owned with mode 0600.
[Service]
LoadCredential=tls-cert:/etc/rusty-sock/tls/cert.pem
LoadCredential=tls-key:/etc/rusty-sock/tls/key.pem
